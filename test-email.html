<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Test</title>
</head>
<body>
    <h1>Email Functionality Test</h1>
    <form id="contact-form" class="contact-form">
        <input type="text" name="name" placeholder="Name" required class="contact-input" value="Test User">
        <input type="email" name="email" placeholder="Email" required class="contact-input" value="test@example.com">
        <textarea name="message" placeholder="Message" required class="contact-input">This is a test message to verify email functionality.</textarea>
        <button type="submit" class="btn-submit">Submit Message</button>
    </form>

    <script>
        // Copy the exact contact form logic from script.js
        const contactForm = document.querySelector("#contact-form");

        if (contactForm) {
            contactForm.addEventListener("submit", function (event) {
                event.preventDefault();

                const name = this.elements["name"].value.trim();
                const email = this.elements["email"].value.trim();
                const message = this.elements["message"].value.trim();

                const subject = encodeURIComponent("Portfolio message from " + name);
                const body = encodeURIComponent(message + "\n\nFrom: " + name + " <" + email + ">");

                const mailtoLink = "mailto:Marvilynlion@gmail.com?subject=" + subject + "&body=" + body;

                console.log("Generated mailto link:", mailtoLink);
                alert("Email functionality test:\n\nGenerated mailto link:\n" + mailtoLink);

                // Uncomment the line below to actually trigger the email client
                // window.location.href = mailtoLink;
            });
        }
    </script>
</body>
</html>
